name: NCC Year Rollover

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — preview changes without applying'
        type: boolean
        default: true
      rollback_id:
        description: 'Rollback to a snapshot (leave empty for normal run)'
        type: string
        default: ''

jobs:
  rollover:
    if: github.repository == 'ncc-app/ncc-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: cd scripts && npm install
      - name: Run rollover
        run: |
          if [ -n "${{ inputs.rollback_id }}" ]; then
            node scripts/rollback.mjs --snapshot-id=${{ inputs.rollback_id }}
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/year-rollover.mjs --dry-run
          else
            node scripts/year-rollover.mjs
            node scripts/auth-cleanup.mjs
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
