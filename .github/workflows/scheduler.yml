name: Automated Schedule Checker

on:
  schedule:
    - cron: '0 * * * *'    # Every hour (0th minute)

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: cd scripts && npm install
      - name: Check schedule
        id: check_schedule
        run: |
          # Run the check script. If it exits with 200, it means we should trigger the rollover
          node scripts/check-schedule.mjs
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 200 ]; then
            echo "TRIGGER_ROLLOVER=true" >> $GITHUB_ENV
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "TRIGGER_ROLLOVER=false" >> $GITHUB_ENV
          else
            echo "Script failed with code $EXIT_CODE"
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          
      - name: Trigger Rollover Workflow
        if: env.TRIGGER_ROLLOVER == 'true'
        run: |
          gh workflow run year-rollover.yml -f dry_run=false
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete Workflow Run (To avoid clutter)
        if: env.TRIGGER_ROLLOVER == 'false'
        run: gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} -X DELETE
        env:
          GH_TOKEN: ${{ github.token }}
