name: Sync Email Verifications

on:
  repository_dispatch:
    types: [sync_verifications]
  workflow_dispatch: {}

jobs:
  sync:
    if: github.repository == 'ncc-app/ncc-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: cd scripts && npm install
        
      - name: Run verification sync
        run: node scripts/sync-verifications.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
